_format_version: "2.1"
_transform: true

# Kong Declarative Config für Supabase auf Client
# Template - Keys werden zur Runtime via Admin API gesetzt (siehe supabase-kong-init.sh)

services:
  # Auth Service (GoTrue)
  - name: supabase-auth
    url: http://host.docker.internal:9999
    routes:
      - name: auth-route
        paths:
          - /auth/v1
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: [GET, POST, PUT, DELETE, OPTIONS]
          headers: [Accept, Authorization, Content-Type, apikey]
          exposed_headers: [X-Total-Count]
          credentials: true
          max_age: 3600

  # REST Service (PostgREST)
  - name: supabase-rest
    url: http://host.docker.internal:3000
    routes:
      - name: rest-route
        paths:
          - /rest/v1
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: [GET, POST, PATCH, DELETE, OPTIONS]
          headers: [Accept, Authorization, Content-Type, apikey, Prefer]
          exposed_headers: [Content-Range, X-Total-Count]
          credentials: true
          max_age: 3600

  # Realtime Service
  - name: supabase-realtime
    url: http://host.docker.internal:4000
    routes:
      - name: realtime-route
        paths:
          - /realtime/v1
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: [GET, POST, OPTIONS]
          headers: [Accept, Authorization, Content-Type, apikey]
          credentials: true
          max_age: 3600

  # Storage Service
  - name: supabase-storage
    url: http://host.docker.internal:5000
    routes:
      - name: storage-route
        paths:
          - /storage/v1
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: [GET, POST, DELETE, OPTIONS]
          headers: [Accept, Authorization, Content-Type, apikey]
          credentials: true
          max_age: 3600

  # Edge Functions
  - name: supabase-functions
    url: http://host.docker.internal:9000
    routes:
      - name: functions-route
        paths:
          - /functions/v1
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: [GET, POST, OPTIONS]
          headers: [Accept, Authorization, Content-Type, apikey]
          credentials: true
          max_age: 3600

# Consumers & Key-Auth werden zur Runtime via Admin API gesetzt
# Siehe: scripts/supabase-kong-init.sh
plugins:
  - name: key-auth
    config:
      key_names: ["apikey"]
      hide_credentials: true
