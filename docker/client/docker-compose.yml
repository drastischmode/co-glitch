
# Co-Glitch Client Stack - Alle Dienste laufen lokal auf dem Client
# Profile: client (Kern), client-ollama (optional), client-extended (optional)
# Labels: co-glitch.tier=client für Health-Check Filterung
# Netzwerk-Segmentierung: net-backend (DB), net-frontend (Apps), net-ai (Ollama)

x-base-service: &base-service
  env_file:
    - ../../.env
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  labels:
    - "co-glitch.tier=client"
  security_opt:
    - no-new-privileges:true

x-healthcheck-db: &healthcheck-db
  test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 30s

x-healthcheck-http: &healthcheck-http
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

# Complete service templates with base + resources combined
x-service-small: &service-small
  env_file:
    - ../../.env
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  labels:
    - "co-glitch.tier=client"
  security_opt:
    - no-new-privileges:true
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: "512m"
      reservations:
        memory: "128m"

x-service-medium: &service-medium
  env_file:
    - ../../.env
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  labels:
    - "co-glitch.tier=client"
  security_opt:
    - no-new-privileges:true
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: "1g"
      reservations:
        memory: "256m"

x-service-large: &service-large
  env_file:
    - ../../.env
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  labels:
    - "co-glitch.tier=client"
  security_opt:
    - no-new-privileges:true
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: "2g"
      reservations:
        memory: "512m"

x-service-ollama: &service-ollama
  env_file:
    - ../../.env
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  labels:
    - "co-glitch.tier=client"
  security_opt:
    - no-new-privileges:true
  deploy:
    resources:
      limits:
        cpus: "4.0"
        memory: "8g"
      reservations:
        memory: "4g"

services:
  # ==========================================
  # NETZWERKE
  # ==========================================
  # net-backend: DB-only (supabase-db, supabase-kong, forgejo)
  # net-frontend: User-facing Apps (n8n, forgejo-web, postiz, kuma, dozzle, beszel, cadvisor)
  # net-ai: Ollama (nur von n8n/opencode erreichbar)

  # ==========================================
  # SUPABASE DB - PostgreSQL für alle Dienste
  # ==========================================
  supabase-db:
    image: supabase/postgres:15.8.1.060
    profiles: ["client"]
    <<: *service-large
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE, FOWNER]
    environment:
      POSTGRES_PASSWORD: ${SUPABASE_DB_PASS}
      POSTGRES_DB: postgres
    volumes:
      - supabase_db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - net-backend

  # ==========================================
  # SUPABASE API (auth, rest, realtime, storage) + KONG-Gateway
  # ==========================================
  # Laeuft komplett auf dem Client. Die Backends sind Docker-Service-Namen,
  # JWT-Pruefung macht jeder Dienst selbst (kein key-auth im Gateway).
  # ACHTUNG: ${...} wird nur mit `--env-file .env` aufgeloest (Makefile tut das).
  auth:
    image: supabase/gotrue:v2.196.0
    profiles: ["client"]
    <<: *service-small
    environment:
      - GOTRUE_API_HOST=0.0.0.0
      - GOTRUE_API_PORT=9999
      - API_EXTERNAL_URL=http://localhost:8000
      - GOTRUE_DB_DRIVER=postgres
      - GOTRUE_DB_DATABASE_URL=postgres://supabase_auth_admin:${SUPABASE_DB_PASS}@supabase-db:5432/postgres
      - GOTRUE_SITE_URL=http://localhost:8000
      - GOTRUE_URI_ALLOW_LIST=*
      - GOTRUE_DISABLE_SIGNUP=false
      - GOTRUE_JWT_ADMIN_ROLES=service_role
      - GOTRUE_JWT_AUD=authenticated
      - GOTRUE_JWT_DEFAULT_GROUP_NAME=authenticated
      - GOTRUE_JWT_EXP=3600
      - GOTRUE_JWT_SECRET=${JWT_SECRET}
      - GOTRUE_JWT_ISSUER=http://localhost:8000/auth/v1
      - GOTRUE_EXTERNAL_EMAIL_ENABLED=true
      - GOTRUE_EXTERNAL_PHONE_ENABLED=false
      - GOTRUE_MAILER_AUTOCONFIRM=true
      - GOTRUE_SMTP_ADMIN_EMAIL=admin@localhost
      - GOTRUE_SMTP_HOST=smtp.invalid
      - GOTRUE_SMTP_PORT=587
      - GOTRUE_SMTP_USER=smtp
      - GOTRUE_SMTP_PASS=smtp
      - GOTRUE_SMTP_SENDER_NAME=co-glitch
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9999/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - net-backend

  rest:
    image: postgrest/postgrest:v14.17
    profiles: ["client"]
    <<: *service-small
    environment:
      - PGRST_DB_URI=postgres://authenticator:${SUPABASE_DB_PASS}@supabase-db:5432/postgres
      - PGRST_DB_SCHEMAS=public,storage,graphql_public
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_JWT_SECRET=${JWT_SECRET}
      - PGRST_DB_USE_LEGACY_GUCS=false
      - PGRST_APP_SETTINGS_JWT_EXP=3600
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - net-backend

  realtime:
    image: supabase/realtime:v2.134.10
    profiles: ["client"]
    <<: *service-medium
    # Tenant = erstes Label des Hostnamens (wie im VPS-Stack: realtime-dev)
    hostname: realtime-dev.supabase-realtime
    environment:
      - PORT=4000
      - DB_HOST=supabase-db
      - DB_PORT=5432
      - DB_USER=supabase_admin
      - DB_PASSWORD=${SUPABASE_DB_PASS}
      - DB_NAME=postgres
      - DB_AFTER_CONNECT_QUERY=SET search_path TO _realtime
      - DB_ENC_KEY=supabaserealtime
      - API_JWT_SECRET=${JWT_SECRET}
      - SECRET_KEY_BASE=${REALTIME_SECRET_KEY_BASE}
      - METRICS_JWT_SECRET=${JWT_SECRET}
      - ERL_AFLAGS=-proto_dist inet_tcp
      - DNS_NODES=''
      - RLIMIT_NOFILE=10000
      - APP_NAME=realtime
      - SEED_SELF_HOST=true
      - RUN_JANITOR=true
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H 'Host: realtime-dev.supabase-realtime' http://127.0.0.1:4000/api/tenants/realtime-dev/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - net-backend

  imgproxy:
    image: darthsim/imgproxy:v3.31.4
    profiles: ["client"]
    <<: *service-small
    environment:
      - IMGPROXY_BIND=:5001
      - IMGPROXY_LOCAL_FILESYSTEM_ROOT=/
      - IMGPROXY_USE_ETAG=true
      - IMGPROXY_MAX_SRC_RESOLUTION=50
    networks:
      - net-backend

  storage:
    image: supabase/storage-api:v1.74.0
    profiles: ["client"]
    <<: *service-small
    environment:
      - ANON_KEY=${ANON_KEY}
      - SERVICE_KEY=${SERVICE_ROLE_KEY}
      - POSTGREST_URL=http://rest:3000
      - AUTH_JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgres://supabase_storage_admin:${SUPABASE_DB_PASS}@supabase-db:5432/postgres
      - STORAGE_BACKEND=file
      - FILE_STORAGE_BACKEND_PATH=/var/lib/storage
      - TENANT_ID=stub
      - REGION=stub
      - GLOBAL_S3_BUCKET=stub
      - ENABLE_IMAGE_TRANSFORMATION=true
      - IMGPROXY_URL=http://imgproxy:5001
    volumes:
      - storage_data:/var/lib/storage
    depends_on:
      supabase-db:
        condition: service_healthy
      rest:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5000/status"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - net-backend

  supabase-kong:
    image: kong:2.8.1
    profiles: ["client"]
    <<: *service-medium
    user: "kong:kong"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
    volumes:
      - ./supabase-kong.yml:/home/kong/kong.yml:ro
    depends_on:
      supabase-db:
        condition: service_healthy
      auth:
        condition: service_started
      rest:
        condition: service_started
      storage:
        condition: service_started
      realtime:
        condition: service_started
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - net-backend
      - net-frontend

  # ==========================================
  # N8N - Workflow Automation
  # ==========================================
  n8n:
    image: n8nio/n8n:1.82.0
    profiles: ["client"]
    <<: *service-medium
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - N8N_HOST=localhost
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - GENERIC_TIMEZONE=${TZ}
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - net-frontend
      - net-backend
      - net-ai

  # ==========================================
  # FORGEJO - Git Hosting
  # ==========================================
  forgejo:
    image: codeberg.org/forgejo/forgejo:9
    profiles: ["client"]
    <<: *service-medium
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    ports:
      - "127.0.0.1:3002:3002"
      - "127.0.0.1:2222:22"
    volumes:
      - forgejo_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - DB_TYPE=postgres
      - DB_HOST=supabase-db:5432
      - DB_NAME=forgejo
      - DB_USER=forgejo
      - DB_PASSWD=${FORGEJO_DB_PASS}
      - APP_NAME="co-glitch Forgejo"
      - RUN_MODE=prod
      - DOMAIN=localhost
      - SSH_PORT=2222
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3002/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - net-frontend
      - net-backend

  # ==========================================
  # REDIS - für Postiz (Extended)
  # ==========================================
  redis:
    image: redis:7-alpine
    profiles: ["client-extended"]
    env_file:
      - ../../.env
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "co-glitch.tier=client"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256m"
        reservations:
          memory: "64m"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - net-backend

  # ==========================================
  # POSTIZ - Social Media Scheduling
  # ==========================================
  # ==========================================
  # TEMPORAL - Pflicht-Backend fuer Postiz
  # ==========================================
  # Postiz v2 verbindet sich beim Start mit Temporal (TEMPORAL_ADDRESS).
  # Ohne Temporal crasht das Backend mit ECONNREFUSED 7233 und nginx
  # liefert 502 - der Container-Healthcheck (nginx-Port) bleibt trotzdem
  # "healthy". Diese beiden Services schliessen die Luecke.
  temporal-postgresql:
    image: postgres:16
    profiles: ["client-extended"]
    <<: *service-small
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASS}
      POSTGRES_DB: temporal
    volumes:
      - temporal_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - net-backend

  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    profiles: ["client-extended"]
    <<: *service-large
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - temporal_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 90s
    networks:
      - net-backend

  temporal:
    image: temporalio/auto-setup:1.28.1
    profiles: ["client-extended"]
    <<: *service-medium
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_DB_PASS}
      - POSTGRES_SEEDS=temporal-postgresql
      - BIND_ON_IP=0.0.0.0
      - TEMPORAL_NAMESPACE=default
      # Advanced Visibility: ohne ES erlaubt Temporal nur 3 Text-Search-Attribute,
      # Postiz braucht mehr ("cannot have more than 3 search attribute of type Text").
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
    depends_on:
      temporal-postgresql:
        condition: service_healthy
      temporal-elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - net-backend

  postiz:
    image: ghcr.io/gitroomhq/postiz-app:v2.25.1
    profiles: ["client-extended"]
    # Postiz v2 braucht ~1.5 GB: mit dem 1-GiB-Limit (service-medium) kam das
    # Backend nicht auf Port 3000 hoch (nginx lieferte 502, Healthcheck gruen).
    <<: *service-large
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE]
    ports:
      - "127.0.0.1:4007:5000"
    environment:
      - JWT_SECRET=${POSTIZ_JWT_SECRET}
      - DATABASE_URL=postgresql://postgres:${SUPABASE_DB_PASS}@supabase-db:5432/postgres
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - DISABLE_REGISTRATION=true
      - MAIN_URL=http://localhost:4007
      - FRONTEND_URL=http://localhost:4007
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:4007/api
      - BACKEND_INTERNAL_URL=http://localhost:3000
      - TEMPORAL_ADDRESS=temporal:7233
      - IS_GENERAL=true
    volumes:
      - postiz_data:/app/data
    depends_on:
      supabase-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(5000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - net-frontend
      - net-backend

  # ==========================================
  # UPTIME KUMA - Monitoring
  # ==========================================
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16
    profiles: ["client"]
    <<: *service-small
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - kuma_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - net-frontend

  # ==========================================
  # DOZZLE - Container Logs UI
  # ==========================================
  dozzle:
    image: amir20/dozzle:v11.3.4
    profiles: ["client"]
    <<: *service-small
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - net-frontend

  # ==========================================
  # BESZEL HUB - System Monitoring
  # ==========================================
  beszel:
    image: henrygd/beszel:0.21.0
    profiles: ["client"]
    <<: *service-small
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - beszel_data:/beszel_data
    environment:
      - HTTP_PORT=8090
    networks:
      - net-frontend

  # ==========================================
  # BESZEL AGENT - für lokale Metriken
  # ==========================================
  beszel-agent:
    image: henrygd/beszel-agent:0.21.0
    # Benoetigt BESZEL_AGENT_KEY (Public Key aus dem Beszel-Hub) -> nicht im Default-Profil
    profiles: ["client-extended"]
    <<: *service-small
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/hostfs:ro
    environment:
      - HUB_URL=http://beszel:8090
      - KEY=${BESZEL_AGENT_KEY:-}
    depends_on:
      - beszel
    networks:
      - net-frontend

  # ==========================================
  # CADVISOR - Container Resource Metrics
  # ==========================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    profiles: ["client"]
    <<: *service-small
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg:ro
    environment:
      - STORAGE_DURATION=2m0s
    networks:
      - net-frontend

  # ==========================================
  # DIUN - Docker Image Update Notifier (Extended)
  # ==========================================
  diun:
    image: crazymax/diun:4.33.0
    profiles: ["client-extended"]
    restart: unless-stopped
    labels:
      - co-glitch.tier=client
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - diun_data:/data
    environment:
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
      - DIUN_WATCH_SCHEDULE=0 */6 * * *

  # ==========================================
  # OLLAMA - Lokale KI (Optional, eigener Profile)
  # ==========================================
  ollama:
    image: ollama/ollama:0.5.12
    profiles: ["client-ollama"]
    <<: *service-ollama
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - net-ai

volumes:
  storage_data:
  temporal_pg_data:
  temporal_es_data:
  supabase_db:
  n8n_data:
  forgejo_data:
  postiz_data:
  kuma_data:
  beszel_data:
  diun_data:
  ollama_data:
  redis_data:

networks:
  net-backend:
    name: co-glitch-backend
    driver: bridge
    internal: true
  net-frontend:
    name: co-glitch-frontend
    driver: bridge
  net-ai:
    name: co-glitch-ai
    driver: bridge
    internal: true
