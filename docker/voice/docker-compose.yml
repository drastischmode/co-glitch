# Co-Glitch Voice Stack - Whisper STT Server
# Profile: voice
# Läuft lokal auf dem Client

x-common-env: &common-env
  env_file:
    - ../../.env
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  labels:
    - "co-glitch.tier=client"

services:
  # ==========================================
  # WHISPER SERVER - Speech to Text
  # ==========================================
  whisper-server:
    image: onerahmet/openai-whisper-asr-webservice:latest
    profiles: ["voice"]
    <<: *common-env
    ports:
      - "127.0.0.1:8081:9000"
    environment:
      - ASR_MODEL=base
      - ASR_ENGINE=openai_whisper
      - WHISPER_API_KEY=  # Optional: API Key für Auth
    volumes:
      - whisper_models:/root/.cache/whisper
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  whisper_models:

networks:
  default:
    name: co-glitch-voice
